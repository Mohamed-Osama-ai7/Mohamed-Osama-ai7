<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%">
  <defs>
    <!-- Card Border Gradients -->
    <linearGradient id="mGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff8c61" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="mGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff4d8d" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="mGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53d8fb" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="mGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff8c61" stop-opacity="0.3" />
    </linearGradient>

    <filter id="metricGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- METRIC 1: 7 Repositories -->
  <g transform="translate(10, 10)">
    <rect width="280" height="110" rx="14" fill="#0d111a" fill-opacity="0.85" stroke="url(#mGrad1)" stroke-width="1.5" />
    <circle cx="28" cy="28" r="4" fill="#ff4500" />
    <text x="42" y="32" class="font-sans" font-size="11" font-weight="800" fill="#ff8c61" letter-spacing="1">VERIFIED ARTIFACTS</text>
    <text x="28" y="78" class="font-sans" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-1">7</text>
    <text x="64" y="68" class="font-sans" font-size="13" font-weight="700" fill="#94a3b8">PUBLIC</text>
    <text x="64" y="84" class="font-sans" font-size="12" font-weight="600" fill="#64748b">REPOSITORIES</text>
  </g>

  <!-- METRIC 2: 13 Benchmarked Models -->
  <g transform="translate(305, 10)">
    <rect width="280" height="110" rx="14" fill="#100e1c" fill-opacity="0.85" stroke="url(#mGrad2)" stroke-width="1.5" />
    <circle cx="28" cy="28" r="4" fill="#a78bfa" />
    <text x="42" y="32" class="font-sans" font-size="11" font-weight="800" fill="#c4b5fd" letter-spacing="1">CHURN RIGOR</text>
    <text x="28" y="78" class="font-sans" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-1">13</text>
    <text x="80" y="68" class="font-sans" font-size="13" font-weight="700" fill="#94a3b8">BENCHMARKED</text>
    <text x="80" y="84" class="font-sans" font-size="12" font-weight="600" fill="#64748b">ML MODELS</text>
  </g>

  <!-- METRIC 3: 0.834 Champion ROC-AUC -->
  <g transform="translate(600, 10)">
    <rect width="280" height="110" rx="14" fill="#09141d" fill-opacity="0.85" stroke="url(#mGrad3)" stroke-width="1.5" />
    <circle cx="28" cy="28" r="4" fill="#53d8fb" />
    <text x="42" y="32" class="font-sans" font-size="11" font-weight="800" fill="#7dd3fc" letter-spacing="1">CHAMPION RANKING</text>
    <text x="28" y="78" class="font-sans" font-size="38" font-weight="900" fill="#53d8fb" letter-spacing="-1">0.834</text>
    <text x="145" y="68" class="font-sans" font-size="13" font-weight="700" fill="#94a3b8">ROC-AUC</text>
    <text x="145" y="84" class="font-sans" font-size="12" font-weight="600" fill="#64748b">SCORE (LOGREG)</text>
  </g>

  <!-- METRIC 4: 81.4% Accuracy / 68+ Contributions -->
  <g transform="translate(895, 10)">
    <rect width="295" height="110" rx="14" fill="#14131a" fill-opacity="0.85" stroke="url(#mGrad4)" stroke-width="1.5" />
    <circle cx="28" cy="28" r="4" fill="#ffd166" />
    <text x="42" y="32" class="font-sans" font-size="11" font-weight="800" fill="#fde68a" letter-spacing="1">BALANCED PERFORMANCE</text>
    <text x="28" y="78" class="font-sans" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-1">81.4%</text>
    <text x="155" y="68" class="font-sans" font-size="13" font-weight="700" fill="#94a3b8">ACCURACY</text>
    <text x="155" y="84" class="font-sans" font-size="12" font-weight="600" fill="#64748b">69.9% PRECISION</text>
  </g>
</svg>
