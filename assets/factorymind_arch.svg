<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="100%">
  <defs>
    <!-- Background & Glowing Effects -->
    <linearGradient id="fm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Arrow Gradients -->
    <linearGradient id="arrow-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="arrow-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="arrow-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="arrow-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Feedback Loop Gradient -->
    <linearGradient id="feedback-grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Node Shadows -->
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .stage-title { font-size: 14px; font-weight: 800; letter-spacing: 1.5px; }
    .stage-desc { font-size: 10.5px; font-weight: 500; fill: #94A3B8; }
    .stage-sub { font-size: 10px; font-weight: 600; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="936" height="256" rx="12" fill="url(#fm-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Header Banner -->
  <g transform="translate(25, 26)">
    <text x="0" y="0" fill="#22D3EE" class="mono" font-size="12" font-weight="700" letter-spacing="1.5px">FACTORYMIND CDT // CLOSED-LOOP COGNITIVE DIGITAL TWIN PARADIGM</text>
    <rect x="660" y="-12" width="230" height="20" rx="10" fill="#131F37" stroke="#22D3EE" stroke-width="1" />
    <text x="672" y="2" fill="#38BDF8" class="mono" font-size="9.5" font-weight="700">ARCHITECTURAL SPECIFICATION</text>
  </g>

  <!-- 1. SENSE NODE (Cyan) -->
  <g transform="translate(25, 50)" filter="url(#node-glow)">
    <rect x="0" y="0" width="155" height="125" rx="8" fill="#081A26" stroke="#22D3EE" stroke-width="1.5" />
    <rect x="0" y="0" width="155" height="28" rx="8" fill="#0F2D42" />
    <circle cx="16" cy="14" r="4" fill="#22D3EE" />
    <text x="28" y="19" fill="#22D3EE" class="sans stage-title">1. SENSE</text>
    <text x="12" y="52" fill="#E2E8F0" class="sans stage-sub">Telemetry Streams</text>
    <text x="12" y="70" class="sans stage-desc">• Vibration Accel</text>
    <text x="12" y="86" class="sans stage-desc">• Thermal Transients</text>
    <text x="12" y="102" class="sans stage-desc">• Edge DSP Filters</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(182, 105)">
    <path d="M 0 0 L 22 0" stroke="url(#arrow-1)" stroke-width="3" fill="none" stroke-linecap="round" />
    <polygon points="22,-5 28,0 22,5" fill="#38BDF8" />
  </g>

  <!-- 2. UNDERSTAND NODE (Electric Blue) -->
  <g transform="translate(212, 50)" filter="url(#node-glow)">
    <rect x="0" y="0" width="155" height="125" rx="8" fill="#0B1C38" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="0" y="0" width="155" height="28" rx="8" fill="#142B57" />
    <circle cx="16" cy="14" r="4" fill="#38BDF8" />
    <text x="28" y="19" fill="#38BDF8" class="sans stage-title">2. UNDERSTAND</text>
    <text x="12" y="52" fill="#E2E8F0" class="sans stage-sub">Signal Intelligence</text>
    <text x="12" y="70" class="sans stage-desc">• Spectral FFT Extract</text>
    <text x="12" y="86" class="sans stage-desc">• Isolation Forests</text>
    <text x="12" y="102" class="sans stage-desc">• Autoencoder Error</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(369, 105)">
    <path d="M 0 0 L 22 0" stroke="url(#arrow-2)" stroke-width="3" fill="none" stroke-linecap="round" />
    <polygon points="22,-5 28,0 22,5" fill="#A855F7" />
  </g>

  <!-- 3. SIMULATE NODE (Neon Purple) -->
  <g transform="translate(399, 50)" filter="url(#node-glow)">
    <rect x="0" y="0" width="155" height="125" rx="8" fill="#1C1033" stroke="#A855F7" stroke-width="1.5" />
    <rect x="0" y="0" width="155" height="28" rx="8" fill="#2E1A52" />
    <circle cx="16" cy="14" r="4" fill="#A855F7" />
    <text x="28" y="19" fill="#C084FC" class="sans stage-title">3. SIMULATE</text>
    <text x="12" y="52" fill="#E2E8F0" class="sans stage-sub">Asset Degradation</text>
    <text x="12" y="70" class="sans stage-desc">• Physics Wear Curves</text>
    <text x="12" y="86" class="sans stage-desc">• Weibull Hazard Rate</text>
    <text x="12" y="102" class="sans stage-desc">• Remaining Life (RUL)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(556, 105)">
    <path d="M 0 0 L 22 0" stroke="url(#arrow-3)" stroke-width="3" fill="none" stroke-linecap="round" />
    <polygon points="22,-5 28,0 22,5" fill="#F59E0B" />
  </g>

  <!-- 4. DECIDE NODE (Gold) -->
  <g transform="translate(586, 50)" filter="url(#node-glow)">
    <rect x="0" y="0" width="155" height="125" rx="8" fill="#261C08" stroke="#F59E0B" stroke-width="1.5" />
    <rect x="0" y="0" width="155" height="28" rx="8" fill="#422E0D" />
    <circle cx="16" cy="14" r="4" fill="#F59E0B" />
    <text x="28" y="19" fill="#FBBF24" class="sans stage-title">4. DECIDE</text>
    <text x="12" y="52" fill="#E2E8F0" class="sans stage-sub">Prescriptive Action</text>
    <text x="12" y="70" class="sans stage-desc">• ISO 10816 Severity</text>
    <text x="12" y="86" class="sans stage-desc">• Root Cause Attrib</text>
    <text x="12" y="102" class="sans stage-desc">• Work Order Dispatch</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g transform="translate(743, 105)">
    <path d="M 0 0 L 22 0" stroke="url(#arrow-4)" stroke-width="3" fill="none" stroke-linecap="round" />
    <polygon points="22,-5 28,0 22,5" fill="#34D399" />
  </g>

  <!-- 5. LEARN NODE (Emerald) -->
  <g transform="translate(773, 50)" filter="url(#node-glow)">
    <rect x="0" y="0" width="145" height="125" rx="8" fill="#0A2218" stroke="#34D399" stroke-width="1.5" />
    <rect x="0" y="0" width="145" height="28" rx="8" fill="#143E2C" />
    <circle cx="16" cy="14" r="4" fill="#34D399" />
    <text x="28" y="19" fill="#34D399" class="sans stage-title">5. LEARN</text>
    <text x="12" y="52" fill="#E2E8F0" class="sans stage-sub">Adaptive Tuning</text>
    <text x="12" y="70" class="sans stage-desc">• Feedback Baseline</text>
    <text x="12" y="86" class="sans stage-desc">• Teardown Logs</text>
    <text x="12" y="102" class="sans stage-desc">• Closed Feedback</text>
  </g>

  <!-- Closed-Loop Feedback Return Arrow -->
  <g transform="translate(0, 0)">
    <path d="M 845 185 L 845 220 L 102 220 L 102 185" stroke="url(#feedback-grad)" stroke-width="2" stroke-dasharray="6,4" fill="none" />
    <polygon points="97,185 102,177 107,185" fill="#38BDF8" />
    <!-- Feedback Tag -->
    <rect x="360" y="210" width="220" height="20" rx="10" fill="#0A0D18" stroke="#34D399" stroke-width="1" />
    <text x="375" y="224" fill="#34D399" class="mono" font-size="9.5" font-weight="700">↺ CLOSED-LOOP CONTINUOUS ADAPTATION</text>
  </g>
</svg>
